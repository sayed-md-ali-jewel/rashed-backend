name: Build and Deploy Backend to Webuzo

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "docs/**"

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    name: Build & Deploy Strapi Backend
    runs-on: ubuntu-22.04

    env:
      # Strapi Environment
      HOST: ${{ vars.STRAPI_HOST || secrets.STRAPI_HOST || '0.0.0.0' }}
      PORT: ${{ vars.STRAPI_PORT || secrets.STRAPI_PORT || '1337' }}
      PUBLIC_URL: ${{ vars.STRAPI_PUBLIC_URL || secrets.STRAPI_PUBLIC_URL }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL || secrets.FRONTEND_URL }}
      APP_KEYS: ${{ secrets.APP_KEYS || vars.APP_KEYS }}
      API_TOKEN_SALT: ${{ secrets.API_TOKEN_SALT || vars.API_TOKEN_SALT }}
      ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET || vars.ADMIN_JWT_SECRET }}
      TRANSFER_TOKEN_SALT: ${{ secrets.TRANSFER_TOKEN_SALT || vars.TRANSFER_TOKEN_SALT }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || vars.JWT_SECRET }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || vars.ENCRYPTION_KEY }}

      # Database Configuration
      DATABASE_HOST: ${{ secrets.DATABASE_HOST || vars.DATABASE_HOST }}
      DATABASE_PORT: ${{ vars.DATABASE_PORT || secrets.DATABASE_PORT || '5432' }}
      DATABASE_NAME: ${{ vars.DATABASE_NAME || secrets.DATABASE_NAME || 'doctor_portfolio' }}
      DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME || vars.DATABASE_USERNAME }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD || vars.DATABASE_PASSWORD }}
      DATABASE_SSL: ${{ vars.DATABASE_SSL || secrets.DATABASE_SSL || 'false' }}
      DATABASE_SSL_REJECT_UNAUTHORIZED: ${{ vars.DATABASE_SSL_REJECT_UNAUTHORIZED || secrets.DATABASE_SSL_REJECT_UNAUTHORIZED || 'true' }}
      DATABASE_POOL_MIN: ${{ vars.DATABASE_POOL_MIN || secrets.DATABASE_POOL_MIN || '2' }}
      DATABASE_POOL_MAX: ${{ vars.DATABASE_POOL_MAX || secrets.DATABASE_POOL_MAX || '10' }}
      DATABASE_SCHEMA: ${{ vars.DATABASE_SCHEMA || secrets.DATABASE_SCHEMA || 'public' }}

      # Webuzo FTP Connection
      FTP_SERVER: ${{ secrets.BACKEND_FTP_SERVER || vars.BACKEND_FTP_SERVER || secrets.FTP_SERVER || vars.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.BACKEND_FTP_USERNAME || vars.BACKEND_FTP_USERNAME || secrets.FTP_USERNAME || vars.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.BACKEND_FTP_PASSWORD || vars.BACKEND_FTP_PASSWORD || secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
      FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || secrets.FTP_PROTOCOL || 'ftp' }}
      FTP_PORT: ${{ vars.FTP_PORT || secrets.FTP_PORT || '21' }}
      FTP_SERVER_DIR: ${{ vars.BACKEND_FTP_SERVER_DIR || secrets.BACKEND_FTP_SERVER_DIR || vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR || 'public_html/drrashed.bd/backend/' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate deploy configuration
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret/variable: $name"
              missing=1
            fi
          done
          if [ "$FTP_PROTOCOL" != "ftp" ] && [ "$FTP_PROTOCOL" != "ftps" ]; then
            echo "::error::FTP_PROTOCOL must be either ftp or ftps. Use an SFTP action instead if your server only supports SFTP."
            missing=1
          fi
          exit "$missing"

      - name: Install dependencies
        run: npm ci

      - name: Build Strapi
        run: npm run build

      - name: Prepare deploy folder
        run: |
          rm -rf deploy
          mkdir -p deploy

          # Copy compiled output and runtime assets
          if [ -d dist ]; then cp -r dist deploy/dist; fi
          if [ -d public ]; then cp -r public deploy/public; fi
          if [ -d config ]; then cp -r config deploy/config; fi
          if [ -d database ]; then cp -r database deploy/database; fi
          if [ -d src ]; then cp -r src deploy/src; fi
          if [ -f favicon.png ]; then cp favicon.png deploy/favicon.png; fi

          # Copy package manifests & entry points
          cp package.json deploy/package.json
          cp package-lock.json deploy/package-lock.json
          if [ -f server.js ]; then
            cp server.js deploy/server.js
            cp server.js deploy/app.js
          fi

          # Install production dependencies only inside deploy folder
          cd deploy
          npm ci --omit=dev
          cd ..

          # Passenger / Webuzo restart signal
          mkdir -p deploy/tmp
          echo "restarted at $(date -u +%Y-%m-%dT%H:%M:%SZ) - ${GITHUB_SHA}" > deploy/tmp/restart.txt

          # Configure deploy package.json
          node -e "const fs=require('fs');const p='deploy/package.json';const pkg=JSON.parse(fs.readFileSync(p,'utf8'));pkg.scripts={start:'node server.js'};pkg.main='server.js';pkg.engines={node:'>=20 <=22.x.x'};fs.writeFileSync(p, JSON.stringify(pkg,null,2)+'\n');"

          # Write production environment files
          {
            echo "NODE_ENV=production"
            echo "HOST=${HOST}"
            echo "PORT=${PORT}"
            echo "PUBLIC_URL=${PUBLIC_URL}"
            echo "FRONTEND_URL=${FRONTEND_URL}"
            echo "APP_KEYS=${APP_KEYS}"
            echo "API_TOKEN_SALT=${API_TOKEN_SALT}"
            echo "ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET}"
            echo "TRANSFER_TOKEN_SALT=${TRANSFER_TOKEN_SALT}"
            echo "JWT_SECRET=${JWT_SECRET}"
            echo "ENCRYPTION_KEY=${ENCRYPTION_KEY}"
            echo "DATABASE_HOST=${DATABASE_HOST}"
            echo "DATABASE_PORT=${DATABASE_PORT}"
            echo "DATABASE_NAME=${DATABASE_NAME}"
            echo "DATABASE_USERNAME=${DATABASE_USERNAME}"
            echo "DATABASE_PASSWORD=${DATABASE_PASSWORD}"
            echo "DATABASE_SSL=${DATABASE_SSL}"
            echo "DATABASE_SSL_REJECT_UNAUTHORIZED=${DATABASE_SSL_REJECT_UNAUTHORIZED}"
            echo "DATABASE_SCHEMA=${DATABASE_SCHEMA}"
            echo "DATABASE_POOL_MIN=${DATABASE_POOL_MIN}"
            echo "DATABASE_POOL_MAX=${DATABASE_POOL_MAX}"
          } > deploy/.env.production
          cp deploy/.env.production deploy/.env

      - name: Upload to Webuzo by FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          protocol: ${{ env.FTP_PROTOCOL }}
          port: ${{ env.FTP_PORT }}
          local-dir: ./deploy/
          server-dir: ${{ env.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
